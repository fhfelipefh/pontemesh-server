name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix. Must match Cargo.toml."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Allow only repository owner
        shell: pwsh
        run: |
          if ("${{ github.actor }}" -ne "${{ github.repository_owner }}") {
            throw "Only the repository owner can publish releases with this workflow."
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must use semver format without the v prefix, for example 0.1.0."
          }

          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not find package version in Cargo.toml."
          }

          $cargoVersion = $Matches[1]
          if ($cargoVersion -ne $version) {
            throw "Input version $version does not match Cargo.toml version $cargoVersion."
          }

          $tag = "v$version"
          if (git rev-parse $tag 2>$null) {
            throw "Tag $tag already exists."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build web panel
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
          npm run build:ci

      - name: Build Windows binary
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $packageName = "pontemesh-server-v$version-windows-x64"
          New-Item -ItemType Directory -Path "dist/$packageName" | Out-Null
          Copy-Item "target/release/pontemesh-server.exe" "dist/$packageName/"
          Copy-Item "README.md" "dist/$packageName/"
          Copy-Item "docs/CONFIGURATION.md" "dist/$packageName/"
          Compress-Archive -Path "dist/$packageName/*" -DestinationPath "dist/$packageName.zip" -Force

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = "v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @(
            "release",
            "create",
            "v${{ inputs.version }}",
            "dist/pontemesh-server-v${{ inputs.version }}-windows-x64.zip",
            "--title",
            "Ponte Mesh Server v${{ inputs.version }}",
            "--generate-notes"
          )

          if ("${{ inputs.prerelease }}" -eq "true") {
            $ghArgs += "--prerelease"
          }

          gh @ghArgs
