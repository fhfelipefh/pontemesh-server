name: Server Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Cargo.toml version must use semver format, for example 0.1.0."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists."
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  web:
    name: Validate and build web panel
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web panel
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
          npm run build:ci

      - name: Upload web panel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pontemesh-server-web
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build server ${{ matrix.target.name }}
    needs: [validate, web]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            os: ubuntu-latest
            archive: tar
          - name: macos-x64
            os: macos-15-intel
            archive: tar
          - name: macos-arm64
            os: macos-latest
            archive: tar
          - name: windows-x64
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore web panel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pontemesh-server-web
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build server binary
        run: cargo build --release --locked

      - name: Package Unix artifact
        if: matrix.target.archive == 'tar'
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          target_name="${{ matrix.target.name }}"
          package="pontemesh-server-v${version}-${target_name}"
          test -f target/release/pontemesh-server
          mkdir -p "dist/$package"
          cp target/release/pontemesh-server README.md docs/CONFIGURATION.md "dist/$package/"
          cp -R deploy "dist/$package/"
          chmod +x "dist/$package/pontemesh-server"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          python3 -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')" "dist/$package.tar.gz"

      - name: Package Windows artifact
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $targetName = "${{ matrix.target.name }}"
          $package = "pontemesh-server-v$version-$targetName"
          if (-not (Test-Path "target/release/pontemesh-server.exe")) {
            throw "The Windows server binary was not produced."
          }
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          Copy-Item "target/release/pontemesh-server.exe" "dist/$package/"
          Copy-Item "README.md" "dist/$package/"
          Copy-Item "docs/CONFIGURATION.md" "dist/$package/"
          Copy-Item "deploy" "dist/$package/" -Recurse
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force
          (Get-FileHash -Algorithm SHA256 "dist/$package.zip").Hash.ToLowerInvariant() | Set-Content "dist/$package.zip.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pontemesh-server-${{ matrix.target.name }}
          path: |
            dist/pontemesh-server-v${{ needs.validate.outputs.version }}-${{ matrix.target.name }}.tar.gz
            dist/pontemesh-server-v${{ needs.validate.outputs.version }}-${{ matrix.target.name }}.tar.gz.sha256
            dist/pontemesh-server-v${{ needs.validate.outputs.version }}-${{ matrix.target.name }}.zip
            dist/pontemesh-server-v${{ needs.validate.outputs.version }}-${{ matrix.target.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish server release
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          manifest="dist/pontemesh-server-v${version}-manifest.json"
          python3 - "$version" "$manifest" <<'PY'
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          manifest_path = pathlib.Path(sys.argv[2])
          expected = {
              f"pontemesh-server-v{version}-linux-x64.tar.gz",
              f"pontemesh-server-v{version}-macos-x64.tar.gz",
              f"pontemesh-server-v{version}-macos-arm64.tar.gz",
              f"pontemesh-server-v{version}-windows-x64.zip",
          }
          assets = []
          for name in sorted(expected):
              path = manifest_path.parent / name
              sha_path = pathlib.Path(str(path) + ".sha256")
              if not path.is_file() or not sha_path.is_file():
                  raise SystemExit(f"missing release artifact or checksum: {name}")
              assets.append({
                  "name": name,
                  "size": path.stat().st_size,
                  "sha256": sha_path.read_text().strip().split()[0],
              })
          manifest_path.write_text(json.dumps({
              "schema": 1,
              "product": "server",
              "version": version,
              "assets": assets,
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Create and push tag
        shell: bash
        run: |
          tag="v${{ needs.validate.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release
            create
            "v${{ needs.validate.outputs.version }}"
            dist/pontemesh-server-v${{ needs.validate.outputs.version }}-*
            --title
            "Ponte Mesh Server v${{ needs.validate.outputs.version }}"
            --generate-notes
          )
          if [ "${{ needs.validate.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Delete older GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="v${{ needs.validate.outputs.version }}"
          current_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${current_tag}" --jq '.id')"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | [.id, .tag_name] | @tsv' |
            while IFS=$'\t' read -r release_id tag_name; do
              if [ "$release_id" != "$current_id" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
                echo "Deleted release ${tag_name}; its Git tag was preserved."
              fi
            done

  quality:
    name: Server quality and real SDK integration
    needs: validate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test web panel
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run i18n:check
          npm run typecheck
          npm run lint
          npm run test
          npm run test:ui:quality
          npm run build:app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Test Server
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked
          cargo test --locked

      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fhfelipefh/pontemesh-sdk
          path: pontemesh-sdk
          persist-credentials: false

      - name: Test current Server against the SDK
        env:
          PONTEMESH_SDK_SOURCE: ${{ github.workspace }}/pontemesh-sdk
        run: ./scripts/ci-sdk-integration.sh
