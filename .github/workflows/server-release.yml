name: Server Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix. Must match Cargo.toml."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version input
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must use semver format without the v prefix, for example 0.1.0."
            exit 1
          fi
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "Input version $version does not match Cargo.toml version $cargo_version."
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists."
            exit 1
          fi

  web:
    name: Validate and build web panel
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web panel
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium
          npm run build:ci

      - name: Upload web panel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pontemesh-server-web
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build server ${{ matrix.target.name }}
    needs: [validate, web]
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            os: ubuntu-latest
            archive: tar
          - name: macos-x64
            os: macos-15-intel
            archive: tar
          - name: macos-arm64
            os: macos-latest
            archive: tar
          - name: windows-x64
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore web panel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pontemesh-server-web
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build server binary
        run: cargo build --release --locked

      - name: Package Unix artifact
        if: matrix.target.archive == 'tar'
        shell: bash
        run: |
          version="${{ inputs.version }}"
          target_name="${{ matrix.target.name }}"
          package="pontemesh-server-v${version}-${target_name}"
          test -f target/release/pontemesh-server
          mkdir -p "dist/$package"
          cp target/release/pontemesh-server README.md docs/CONFIGURATION.md "dist/$package/"
          chmod +x "dist/$package/pontemesh-server"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          python3 -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')" "dist/$package.tar.gz"

      - name: Package Windows artifact
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $targetName = "${{ matrix.target.name }}"
          $package = "pontemesh-server-v$version-$targetName"
          if (-not (Test-Path "target/release/pontemesh-server.exe")) {
            throw "The Windows server binary was not produced."
          }
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          Copy-Item "target/release/pontemesh-server.exe" "dist/$package/"
          Copy-Item "README.md" "dist/$package/"
          Copy-Item "docs/CONFIGURATION.md" "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force
          (Get-FileHash -Algorithm SHA256 "dist/$package.zip").Hash.ToLowerInvariant() | Set-Content "dist/$package.zip.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pontemesh-server-${{ matrix.target.name }}
          path: |
            dist/pontemesh-server-v${{ inputs.version }}-${{ matrix.target.name }}.tar.gz
            dist/pontemesh-server-v${{ inputs.version }}-${{ matrix.target.name }}.tar.gz.sha256
            dist/pontemesh-server-v${{ inputs.version }}-${{ matrix.target.name }}.zip
            dist/pontemesh-server-v${{ inputs.version }}-${{ matrix.target.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish server release
    needs: build
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Build release manifest
        shell: bash
        run: |
          version="${{ inputs.version }}"
          manifest="dist/pontemesh-server-v${version}-manifest.json"
          python3 - "$version" "$manifest" <<'PY'
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          manifest_path = pathlib.Path(sys.argv[2])
          expected = {
              f"pontemesh-server-v{version}-linux-x64.tar.gz",
              f"pontemesh-server-v{version}-macos-x64.tar.gz",
              f"pontemesh-server-v{version}-macos-arm64.tar.gz",
              f"pontemesh-server-v{version}-windows-x64.zip",
          }
          assets = []
          for name in sorted(expected):
              path = manifest_path.parent / name
              sha_path = pathlib.Path(str(path) + ".sha256")
              if not path.is_file() or not sha_path.is_file():
                  raise SystemExit(f"missing release artifact or checksum: {name}")
              assets.append({
                  "name": name,
                  "size": path.stat().st_size,
                  "sha256": sha_path.read_text().strip().split()[0],
              })
          manifest_path.write_text(json.dumps({
              "schema": 1,
              "product": "server",
              "version": version,
              "assets": assets,
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Create and push tag
        shell: bash
        run: |
          tag="v${{ inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release
            create
            "v${{ inputs.version }}"
            dist/pontemesh-server-v${{ inputs.version }}-*
            --title
            "Ponte Mesh Server v${{ inputs.version }}"
            --generate-notes
          )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
