[instance]
name = "Ponte Mesh Replica Edge 1"
role = "replica-edge"

[http]
bind = "0.0.0.0"
port = 8080

[storage.local]
path = "/var/pontemesh_home/data/storage"

[storage.guards]
enabled = true
warning_percent = 80.0
degraded_percent = 90.0
block_percent = 95.0

[garbage_collector]
enabled = true
candidate_scan_interval_seconds = 60
grace_period_seconds = 7200
quarantine_period_seconds = 86400
batch_size = 100
full_gc_interval_seconds = 86400
sweep_lease_seconds = 300
max_retries = 10
temp_file_max_age_seconds = 3600

[replica]
origin_base_url = "https://origin.example.com"
replica_id = "00000000-0000-0000-0000-000000000000"
replica_token = "replace-with-token-shown-once-by-origin"
public_endpoint = "https://edge-1.example.com"
sync_interval_seconds = 30
health_interval_seconds = 30
