name: pontemesh-ha-e2e

services:
  origin-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    image: pontemesh-server:e2e-ha
    environment:
      PONTEMESH_HOME: /var/pontemesh_home
      PONTEMESH_DATABASE_URL: postgres://pontemesh:pontemesh@origin-postgres:5432/pontemesh
      PONTEMESH_WEB_PORT: 8080
      PONTEMESH_S3_PORT: 9000
      RUST_LOG: pontemesh_server=info,tower_http=info
    ports:
      - "18180:8080"
      - "19180:9000"
    volumes:
      - origin_home:/var/pontemesh_home
    depends_on:
      origin-postgres:
        condition: service_healthy
    networks:
      - e2e

  origin-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pontemesh
      POSTGRES_USER: pontemesh
      POSTGRES_PASSWORD: pontemesh
    volumes:
      - origin_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontemesh -d pontemesh"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - e2e

  replica-1:
    image: pontemesh-server:e2e-ha
    environment:
      PONTEMESH_HOME: /var/pontemesh_home
      PONTEMESH_DATABASE_URL: postgres://pontemesh:pontemesh@replica-1-postgres:5432/pontemesh
      PONTEMESH_WEB_PORT: 8080
      PONTEMESH_S3_PORT: 9000
      RUST_LOG: pontemesh_server=info,tower_http=info
    ports:
      - "18181:8080"
    volumes:
      - replica_1_home:/var/pontemesh_home
    depends_on:
      replica-1-postgres:
        condition: service_healthy
      origin-server:
        condition: service_started
    networks:
      - e2e

  replica-1-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pontemesh
      POSTGRES_USER: pontemesh
      POSTGRES_PASSWORD: pontemesh
