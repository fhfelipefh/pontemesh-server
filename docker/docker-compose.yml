name: ponte-mesh

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    image: pontemesh-server:local
    restart: unless-stopped
    environment:
      PONTEMESH_HOME: /var/pontemesh_home
      PONTEMESH_DATABASE_URL: postgres://pontemesh:${PONTEMESH_POSTGRES_PASSWORD:?Set PONTEMESH_POSTGRES_PASSWORD}@postgres:5432/pontemesh
      PONTEMESH_WEB_PORT: 8080
      PONTEMESH_S3_PORT: 9000
      PONTEMESH_S3_BOOTSTRAP_ACCESS_KEY_ID: ${PONTEMESH_S3_BOOTSTRAP_ACCESS_KEY_ID:-}
      PONTEMESH_S3_BOOTSTRAP_SECRET_ACCESS_KEY: ${PONTEMESH_S3_BOOTSTRAP_SECRET_ACCESS_KEY:-}
      RUST_LOG: pontemesh_server=info,tower_http=info
    ports:
      - "${PONTEMESH_WEB_HOST_PORT:-8080}:8080"
      - "${PONTEMESH_S3_HOST_PORT:-9000}:9000"
    volumes:
      - pontemesh_home:/var/pontemesh_home
      # To use a specific host directory on Linux, replace the named volume with:
      # - /mnt/hd/pontemesh:/var/pontemesh_home
      #
      # On Windows, use a bind mount such as:
      # - D:/PonteMesh:/var/pontemesh_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: pontemesh
      POSTGRES_USER: pontemesh
      POSTGRES_PASSWORD: ${PONTEMESH_POSTGRES_PASSWORD:?Set PONTEMESH_POSTGRES_PASSWORD}
    volumes:
      - pontemesh_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontemesh -d pontemesh"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pontemesh_home:
  pontemesh_postgres:
